<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Conductor</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='2' y='2' width='60' height='60' rx='17' fill='%235B4BFF'/%3E%3Cpath d='M45 19a18 18 0 1 0 0 26' stroke='%23fff' stroke-width='7' stroke-linecap='round' fill='none'/%3E%3Cpath d='M43 33L55 16' stroke='%23FFC83D' stroke-width='4.5' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFF6E6; --card:#fff; --ink:#221C44; --mute:#6E6A8A; --line:#EADFC8;
  --pri:#5B4BFF; --priD:#3D2FD0; --yel:#FFC83D; --grn:#22C27A; --red:#F2545B;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:#1B1638;font-family:Nunito,system-ui,sans-serif;color:var(--ink);display:flex;align-items:center;justify-content:center;overflow:hidden}
.app{position:relative;width:min(100vw,420px);height:min(100dvh,840px);background:var(--bg);overflow:hidden;display:flex;flex-direction:column}
@media(min-width:440px){.app{border-radius:36px;box-shadow:0 30px 80px rgba(0,0,0,.5)}}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
button:focus-visible,input:focus-visible{outline:3px solid var(--pri);outline-offset:3px}
h1{font-family:"Baloo 2",Nunito,sans-serif;font-weight:800;font-size:31px;line-height:1.05;margin:0;letter-spacing:-.3px}
p{margin:8px 0 0;font-size:17px;font-weight:700;color:var(--mute);line-height:1.3}

/* top bar */
.top{display:flex;align-items:center;gap:10px;padding:14px 16px 6px;height:52px;flex:none}
.back{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;background:#fff;box-shadow:0 3px 0 var(--line)}
.back[hidden]{display:block;visibility:hidden}
.bar{flex:1;height:14px;background:#EFE4CC;border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--grn),#7BE0A8);border-radius:99px;transition:width .5s cubic-bezier(.3,1.4,.5,1)}
.demo{font-size:11px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;background:var(--ink);color:#fff;padding:5px 9px;border-radius:99px}

/* screen */
.scr{flex:1;min-height:0;display:flex;flex-direction:column;padding:6px 20px 20px}
.scr.enter{animation:slide .42s cubic-bezier(.2,1.2,.4,1)}
@keyframes slide{from{opacity:0;transform:translateX(36px)}to{opacity:1;transform:none}}
.art{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center}
.txt{text-align:center;padding:10px 4px 16px;flex:none}
.cta{display:flex;flex-direction:column;gap:12px;flex:none}
.btn{height:62px;border-radius:20px;background:var(--pri);color:#fff;font-weight:800;font-size:20px;box-shadow:0 6px 0 var(--priD);transition:transform .08s,box-shadow .08s,background .2s;width:100%}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--priD)}
.btn[disabled]{background:#D9D2EE;box-shadow:0 6px 0 #C2BADD;color:#fff;cursor:default}
.btn.alt{background:#fff;color:var(--ink);box-shadow:0 6px 0 var(--line)}
.btn.grn{background:var(--grn);box-shadow:0 6px 0 #15975C}
.btn.pulse{animation:pulse 1.4s infinite}
@keyframes pulse{50%{transform:scale(1.03)}}

/* avatars */
.av{display:inline-block;width:64px;height:64px;flex:none}
.av svg{width:100%;height:100%;display:block;overflow:visible}
.bob{animation:bob 2.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-10px) rotate(3deg)}}
@keyframes pop{0%{transform:scale(0)}70%{transform:scale(1.2)}100%{transform:scale(1)}}
@keyframes bounce{0%{transform:scale(1)}30%{transform:scale(.88)}60%{transform:scale(1.12) rotate(-4deg)}100%{transform:scale(1)}}
@keyframes wob{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}

/* welcome */
.orbit{position:relative;width:280px;height:280px}
.orbit .logo{position:absolute;inset:80px;border-radius:40px;background:var(--pri);box-shadow:0 8px 0 var(--priD);display:grid;place-items:center;animation:pulse 2.4s infinite}
.orbit .o{position:absolute;left:108px;top:108px}
.word{font-family:"Baloo 2",Nunito,system-ui,sans-serif;font-weight:800;font-size:20px;color:var(--pri);letter-spacing:.5px;margin-bottom:4px}

/* signup */
.tag{width:250px;background:var(--red);border-radius:22px;padding:10px 10px 12px;box-shadow:0 8px 0 #C43B42;transform:rotate(-3deg);text-align:center;color:#fff;animation:wob 4s ease-in-out infinite}
.tag small{font-weight:800;letter-spacing:2px;font-size:13px;display:block}
.tag div{background:#fff;color:var(--ink);border-radius:14px;margin-top:8px;height:74px;display:grid;place-items:center;font-family:"Baloo 2",Nunito,system-ui,sans-serif;font-weight:800;font-size:30px;overflow:hidden;white-space:nowrap;padding:0 8px}
.field{height:58px;border-radius:18px;border:3px solid var(--line);background:#fff;font:800 19px Nunito,sans-serif;color:var(--ink);padding:0 18px;width:100%}
.field:focus{border-color:var(--pri);outline:0}

/* pick */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%}
.tile{background:#fff;border-radius:24px;padding:12px 8px 10px;display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:800;font-size:18px;box-shadow:0 6px 0 var(--line);border:4px solid transparent;position:relative;transition:border-color .15s}
.tile:last-child:nth-child(odd){grid-column:1/3;justify-self:center;width:calc(50% - 6px)}
.tile.on{border-color:var(--c);animation:bounce .45s}
.tile .ck{position:absolute;top:-8px;right:-8px;width:30px;height:30px;border-radius:50%;background:var(--grn);display:grid;place-items:center;transform:scale(0)}
.tile.on .ck{animation:pop .35s forwards}

/* playbook */
.pb{display:flex;flex-direction:column;align-items:center;gap:14px;width:100%;height:100%;justify-content:center}
.hero{position:relative;display:flex;align-items:center;gap:10px}
.hero .av{width:104px;height:104px;z-index:3}
.book{width:120px;height:140px;border-radius:16px;background:#fff;box-shadow:0 7px 0 var(--line);padding:14px 12px;display:flex;flex-direction:column;gap:9px;transform:rotate(5deg);border-top:14px solid var(--c)}
.book i{height:9px;border-radius:9px;background:#EDE6F7}
.book i:nth-child(2){width:70%}.book i:nth-child(4){width:55%}
.book b{margin-top:auto;font-size:10px;font-weight:800;background:var(--yel);border-radius:8px;padding:4px 6px;text-align:center}
.book.done{animation:bounce .5s}
.bench{display:flex;gap:8px;padding:10px 14px 8px;background:#fff;border-radius:22px;box-shadow:0 6px 0 var(--line);position:relative}
.bench:before{content:"TEAM BENCH";position:absolute;top:-9px;left:50%;transform:translateX(-50%);font-size:10px;font-weight:800;letter-spacing:1.5px;background:var(--ink);color:#fff;padding:2px 8px;border-radius:99px;white-space:nowrap}
.slot{width:46px;height:46px;border-radius:50%;border:3px dashed #D8CDB4;display:grid;place-items:center}
.slot .av{width:42px;height:42px;display:none}
.slot.in{border-color:transparent}.slot.in .av{display:block;animation:pop .4s}

/* rows (report + reveal) */
.rows{display:flex;flex-direction:column;gap:9px;width:100%;max-height:100%}
.row{display:flex;align-items:center;gap:12px;background:#fff;border-radius:20px;padding:8px 12px;box-shadow:0 4px 0 var(--line);min-height:62px}
.row .av{width:46px;height:46px}
.row .who{font-weight:800;font-size:16px;line-height:1.1}
.row .say{font-size:14px;font-weight:700;color:var(--mute);line-height:1.2;margin-top:2px}
.row.wait{opacity:.75}.row.wait .av{animation:wob .8s ease-in-out infinite}
.row.got{animation:bounce .5s}
.row .ok{margin-left:auto;width:28px;height:28px;border-radius:50%;background:var(--grn);display:grid;place-items:center;flex:none;animation:pop .4s}
.dots{display:inline-flex;gap:5px;margin-top:6px}
.dots i{width:9px;height:9px;border-radius:50%;background:#C9C3DD;animation:dot 1s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes dot{30%{transform:translateY(-7px);background:var(--pri)}}
.row.card{opacity:0;animation:deal .5s cubic-bezier(.2,1.4,.4,1) forwards}
@keyframes deal{from{opacity:0;transform:translateY(30px) scale(.8) rotate(-4deg)}to{opacity:1;transform:none}}
.badges{display:flex;gap:5px;flex-wrap:wrap;margin-top:4px}
.bdg{display:inline-flex;align-items:center;gap:4px;background:var(--c);color:#fff;font-weight:800;font-size:12.5px;padding:4px 8px 4px 6px;border-radius:99px}
.bdg.new{background:#E7E1F5;color:var(--mute);padding:4px 10px}

/* conflict */
.tug{display:flex;align-items:center;justify-content:center;gap:6px;width:100%}
.tug .av{width:92px;height:92px;transition:transform .5s cubic-bezier(.2,1.5,.4,1),opacity .4s}
.tug .l{animation:pullL 1s ease-in-out infinite}.tug .r{animation:pullR 1s ease-in-out infinite}
@keyframes pullL{50%{transform:translateX(-8px) rotate(-6deg)}}
@keyframes pullR{50%{transform:translateX(8px) rotate(6deg)}}
.prize{width:84px;height:84px;border-radius:26px;background:var(--c);display:grid;place-items:center;box-shadow:0 6px 0 rgba(0,0,0,.18);animation:wob .5s ease-in-out infinite;transition:transform .5s cubic-bezier(.2,1.5,.4,1);z-index:2}
.tug.win-l .prize{transform:translateX(-70px) scale(.7)}.tug.win-r .prize{transform:translateX(70px) scale(.7)}
.tug.win-l .r,.tug.win-r .l{opacity:.3;transform:scale(.8)}
.tug.win-l .l,.tug.win-r .r,.tug.win-s .av{animation:bounce .5s}

.taps{position:absolute;top:4px;left:50%;transform:translateX(-50%);background:#fff;border-radius:99px;padding:6px 14px;font-weight:800;font-size:14px;box-shadow:0 3px 0 var(--line);white-space:nowrap}
.taps b{color:var(--pri);font-size:17px}
.three{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.three .btn{font-size:19px;background:var(--c);box-shadow:0 6px 0 rgba(0,0,0,.25)}
.three .btn.alt{grid-column:1/3;background:#fff;box-shadow:0 6px 0 var(--line)}

/* preset */
.newbie{display:flex;flex-direction:column;align-items:center;gap:14px}
.newbie .av{width:120px;height:120px}
.role{display:flex;align-items:center;gap:10px;background:var(--c);color:#fff;font-weight:800;font-size:21px;padding:12px 20px 12px 14px;border-radius:99px;box-shadow:0 6px 0 rgba(0,0,0,.18)}
.role.swap{animation:pop .35s}

/* chief */
.chief{display:flex;flex-direction:column;align-items:center;gap:22px;width:100%}
.seat{width:150px;height:150px;border-radius:50%;border:5px dashed #D8CDB4;display:grid;place-items:center;position:relative;font-family:"Baloo 2",Nunito,system-ui,sans-serif;font-weight:800;font-size:54px;color:#D8CDB4}
.seat.full{border-style:solid;border-color:var(--yel);background:#FFF1C7}
.seat .av{width:112px;height:112px;animation:pop .4s}
.crown{position:absolute;top:-58px;left:50%;margin-left:-38px;width:76px;opacity:0}
.seat.full .crown{animation:crown .7s cubic-bezier(.3,1.6,.5,1) forwards}
@keyframes crown{0%{opacity:0;transform:translateY(-140px) rotate(-30deg) scale(1.6)}60%{opacity:1;transform:translateY(8px) rotate(6deg)}100%{opacity:1;transform:rotate(-6deg)}}
.line{display:flex;gap:8px;justify-content:center}
.line button{border-radius:50%;padding:3px;border:4px solid transparent}
.line button.on{border-color:var(--yel)}
.line .av{width:52px;height:52px}

/* done */
.party{display:flex;justify-content:center;align-items:flex-end;gap:2px}
.party .av{width:66px;height:66px;animation:jump .7s ease-in-out infinite}
.party span:nth-child(2n) .av{animation-delay:.2s}.party span:nth-child(3n) .av{animation-delay:.35s}
@keyframes jump{50%{transform:translateY(-26px) rotate(6deg)}}
.conf{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:5}
.conf i{position:absolute;top:-20px;width:10px;height:16px;border-radius:3px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(900px) rotate(720deg)}}

/* launch pad */
.pad{flex:1;min-height:0;display:flex;flex-direction:column;padding:14px 16px 16px;gap:10px}
.padh{display:flex;align-items:center;gap:8px}
.padh h1{font-size:26px;flex:1}
.cos{display:flex;align-items:center;gap:4px;background:#FFF1C7;border-radius:99px;padding:3px 10px 3px 4px;font-weight:800;font-size:12px}
.cos .av{width:26px;height:26px}
.sw{position:relative;display:grid;grid-template-columns:repeat(3,1fr);background:var(--ink);border-radius:22px;padding:6px;height:64px;flex:none}
.sw .th{position:absolute;top:6px;bottom:6px;left:6px;width:calc((100% - 12px)/3);border-radius:17px;background:var(--grn);transition:transform .35s cubic-bezier(.3,1.5,.5,1),background .3s}
.sw[data-m=pause] .th{transform:translateX(100%);background:var(--yel)}
.sw[data-m=off] .th{transform:translateX(200%);background:var(--red)}
.sw button{position:relative;z-index:1;color:#9C96BD;font-weight:800;font-size:18px;letter-spacing:1px}
.sw button[aria-checked=true]{color:#fff}
.sw[data-m=pause] button[aria-checked=true]{color:var(--ink)}
.stat{text-align:center;font-size:14.5px;font-weight:800;color:var(--mute);margin:0}
.grid{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:1fr;gap:10px}
.m{border-radius:22px;background:var(--c);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-family:"Baloo 2",Nunito,system-ui,sans-serif;font-weight:800;font-size:20px;box-shadow:0 6px 0 rgba(0,0,0,.2);position:relative;transition:transform .08s,filter .3s,opacity .3s}
.m:active{transform:translateY(4px)}
.m .own{position:absolute;top:6px;right:6px;display:flex}
.m .own .av{width:28px;height:28px;margin-left:-8px;background:#fff;border-radius:50%;padding:2px}
.pad[data-m=pause] .m{filter:saturate(.45)}
.pad[data-m=off] .m{filter:grayscale(1);opacity:.55}
.sheet{position:absolute;inset:0;background:rgba(27,22,56,.55);z-index:8;display:flex;align-items:flex-end;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.sheet>div{background:var(--bg);width:100%;border-radius:32px 32px 0 0;padding:26px 20px 22px;text-align:center;animation:up .4s cubic-bezier(.2,1.3,.4,1)}
@keyframes up{from{transform:translateY(100%)}}
.sheet .big{display:flex;justify-content:center;align-items:center;gap:6px;margin-bottom:12px}
.sheet .big .av{width:84px;height:84px}
.sheet .ico{width:64px;height:64px;border-radius:20px;background:var(--c);display:grid;place-items:center}
.sheet .cta{margin-top:18px}
.toast{position:absolute;left:50%;top:16px;transform:translateX(-50%);background:var(--ink);color:#fff;font-weight:800;font-size:14px;padding:10px 16px;border-radius:99px;z-index:9;white-space:nowrap;animation:pop .3s}

/* wins */
.wins{display:flex;align-items:center;gap:10px;background:#fff;border-radius:18px;height:50px;padding:0 14px 0 8px;box-shadow:0 4px 0 var(--line);font-weight:800;font-size:14px;flex:none;width:100%;text-align:left}
.wins .tro{width:34px;height:34px;border-radius:12px;background:var(--yel);display:grid;place-items:center;flex:none}
.wins b{font-family:"Baloo 2",Nunito,system-ui,sans-serif;font-size:24px;color:var(--pri);line-height:1}
.wins .last{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--mute)}
.wins.bump .tro,.wins.bump b{animation:bounce .5s}
.m.win{animation:bounce .6s;box-shadow:0 0 0 4px var(--bg),0 0 0 9px var(--yel);z-index:2}
.winc{position:absolute;left:16px;right:16px;bottom:80px;z-index:7;background:#fff;border-radius:24px;padding:12px 14px;display:flex;align-items:center;gap:12px;box-shadow:0 7px 0 var(--line),0 18px 40px rgba(34,28,68,.28);animation:winin .5s cubic-bezier(.2,1.5,.4,1)}
.winc.out{animation:winout .4s forwards}
@keyframes winin{from{transform:translateY(140px) scale(.6);opacity:0}}
@keyframes winout{to{transform:translateY(80px) scale(.2);opacity:0}}
.winc .av{width:56px;height:56px;animation:jump .6s 3}
.winc .t{flex:1;min-width:0}
.winc .t small{display:block;font-size:12px;letter-spacing:1px;color:#128A53;font-weight:800;text-transform:uppercase}
.winc .t div{font-family:"Baloo 2",Nunito,system-ui,sans-serif;font-weight:800;font-size:20px;line-height:1.1}
.winc .stamp{width:44px;height:44px;border-radius:50%;background:var(--grn);display:grid;place-items:center;flex:none;animation:stamp .5s .25s both}
@keyframes stamp{0%{transform:scale(3) rotate(-40deg);opacity:0}60%{transform:scale(.85);opacity:1}100%{transform:scale(1);opacity:1}}
.winc i.p{position:absolute;right:36px;top:50%;width:9px;height:9px;border-radius:3px;pointer-events:none;animation:burst .9s .35s ease-out both}
@keyframes burst{0%{transform:translate(0,0) scale(0);opacity:1}100%{transform:translate(var(--dx),var(--dy)) rotate(300deg) scale(1);opacity:0}}
.sheet .rows{margin:14px 0 0;text-align:left}

/* v3: team health, briefing, needs-you */
.team{display:flex;align-items:center;gap:8px;width:100%;height:34px;flex:none}
.team .tm{display:flex;gap:5px}
.team .w{position:relative;display:block}
.team .av{width:30px;height:30px}
.dot{position:absolute;right:-3px;bottom:-3px;width:12px;height:12px;border-radius:50%;border:2px solid var(--bg);background:var(--grn)}
.dot.q{background:var(--yel)}
.pad[data-m=off] .dot{background:#B9B4C9}
.team .stat{flex:1;text-align:right;font-size:13.5px}
.row .dot{position:static;border:0;width:14px;height:14px;margin-left:auto;flex:none}
.brief{display:flex;gap:10px;flex:none;height:62px}
.bplay{flex:1;min-width:0;display:flex;align-items:center;gap:10px;background:var(--ink);color:#fff;border-radius:20px;padding:0 12px 0 8px;box-shadow:0 5px 0 #0F0B26;text-align:left}
.bplay:active,.need:active{transform:translateY(3px)}
.bplay .av{width:44px;height:44px}
.bplay small{display:block;font-size:11px;letter-spacing:1px;font-weight:800;color:var(--yel)}
.bplay .l{font-weight:800;font-size:15px;line-height:1.15}
.bplay .pl{margin-left:auto;width:34px;height:34px;border-radius:50%;background:var(--yel);display:grid;place-items:center;flex:none}
.need{width:92px;flex:none;border-radius:20px;background:#D8343F;color:#fff;box-shadow:0 5px 0 #A8232D;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;font-size:12px;line-height:1.1}
.need b{font-family:"Baloo 2",Nunito,system-ui,sans-serif;font-size:26px;line-height:.95}
.need.has{animation:pulse 1.4s infinite}
.need.clear{background:var(--grn);box-shadow:0 5px 0 #15975C;color:var(--ink)}
.wave{display:flex;gap:5px;align-items:center;justify-content:center;height:42px;margin-left:8px}
.wave i{width:6px;height:12px;border-radius:6px;background:var(--pri);animation:wave .7s ease-in-out infinite}
.wave i:nth-child(2){animation-delay:.1s}.wave i:nth-child(3){animation-delay:.25s}.wave i:nth-child(4){animation-delay:.05s}.wave i:nth-child(5){animation-delay:.3s}
@keyframes wave{50%{height:40px}}
.bl{font-family:"Baloo 2",Nunito,system-ui,sans-serif;font-weight:800;font-size:23px;line-height:1.15;margin-top:10px;opacity:0;animation:deal .5s cubic-bezier(.2,1.4,.4,1) forwards}
.left{display:inline-block;background:var(--ink);color:#fff;font-size:12px;font-weight:800;letter-spacing:.5px;padding:4px 10px;border-radius:99px;margin-bottom:12px}
.bigok{width:84px;height:84px;border-radius:50%;background:var(--grn);display:grid;place-items:center;animation:stamp .5s both}
@media(max-height:700px){.m{font-size:17px}.m>svg{width:28px;height:28px}}

/* v4: nav, team levels, recap, history, export, edit owner */
.nav{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;height:52px;flex:none}
.nb{background:#fff;border-radius:18px;box-shadow:0 4px 0 var(--line);font-weight:800;font-size:15px;display:flex;align-items:center;justify-content:center;gap:6px}
.nb[aria-current=page]{background:var(--ink);color:#fff;box-shadow:0 4px 0 #0F0B26}
.nb b{font-family:"Baloo 2",Nunito,system-ui,sans-serif;font-size:20px;line-height:1;color:var(--pri)}
.nb[aria-current=page] b{color:var(--yel)}

.steps{display:flex;align-items:center;gap:6px;margin-bottom:10px}

const LOGOS={chatgpt:'logos/chatgpt.png',claude:'logos/claude.png',grok:'logos/grok.png',gemini:'logos/gemini.png',muse:'logos/muse.png',perplexity:'logos/perplexity.png',devin:'logos/devin.png',victor:'logos/victor.png',copilot:'logos/copilot.png',hermes:'logos/hermes.png',openclaw:'logos/openclaw.png'};

const CAP=`<svg class="cap" viewBox="0 0 80 48" aria-hidden="true"><path d="M20 24v12c8 8 32 8 40 0V24" fill="#3D2FD0"/><path d="M40 4l36 14-36 14L4 18z" fill="#221C44"/><path d="M70 20v14" stroke="#FFC83D" stroke-width="3.5" stroke-linecap="round"/><circle cx="70" cy="37" r="4.5" fill="#FFC83D"/></svg>`;

/* ---------- state ---------- */
const S={i:0,name:'',email:'',sel:[],joined:{},decided:{},presets:{},chief:null,mode:'on',steps:[],wins:[],wk:0,needs:[],extra:{},blocked:0,keys:{},codes:{},rep:{},seen:{},tasks:[],fresh:[],authed:false,onboarded:false,otherName:null,skew:0,_known:null,tab:'pad',q:'',fa:null,over:{},sound:true,team:null,focus:null,skipped:{},failed:{},fixed:false,quiet:false,benched:{},manage:false};
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches, DESK=matchMedia('(min-width:900px)');
const URLS={chatgpt:'https://chatgpt.com',claude:'https://claude.ai',grok:'https://grok.com',gemini:'https://gemini.google.com',perplexity:'https://www.perplexity.ai',devin:'https://devin.ai',copilot:'https://copilot.microsoft.com'};
const $=(q,r=document)=>r.querySelector(q), $$=(q,r=document)=>[...r.querySelectorAll(q)];
const esc=s=>s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
let timers=[],iv=null; const later=(f,ms)=>timers.push(setTimeout(f,RM?Math.min(ms,250):ms));
const sel=()=>ORDER.filter(id=>S.sel.includes(id));
const live=()=>sel().filter(id=>!S.skipped[id]&&!S.benched[id]);
const freshIds=()=>live().filter(id=>AIS[id].fresh);
function conflicts(){return DORDER.filter(d=>live().filter(id=>AIS[id].d.includes(d)).length>=2)}
function holders(d){return live().filter(id=>AIS[id].d.includes(d)).slice(0,2)}
function owners(d){
  if(S.over[d])return S.over[d].filter(id=>live().includes(id));
  const h=holders(d); let o=[];
  if(h.length===1)o=h; else if(h.length>=2){const c=S.decided[d]; o=!c?[]:c==='share'?h:[c]}
  for(const id of live())if(S.presets[id]===d&&!o.includes(id))o=o.concat(id);
  if(S.extra[d]&&live().includes(S.extra[d])&&!o.includes(S.extra[d]))o=o.concat(S.extra[d]);
  return o;
}
function presetOpts(f){const o=PRESETS.filter(d=>live().filter(id=>id!==f&&(AIS[id].d.includes(d)||S.presets[id]===d)).length===0);return o.length?o:PRESETS}

/* ---------- sound (synthesized, no files) ---------- */
let AC=null;
function ac(){if(!S.sound)return null;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();return AC}catch(e){return null}}
function tone(f,t=0,d=.12,type='sine',v=.1,f2){const a=ac();if(!a)return;try{const o=a.createOscillator(),g=a.createGain(),st=a.currentTime+t;o.type=type;o.frequency.setValueAtTime(f,st);if(f2)o.frequency.exponentialRampToValueAtTime(f2,st+d);g.gain.setValueAtTime(.0001,st);g.gain.linearRampToValueAtTime(v,st+.012);g.gain.exponentialRampToValueAtTime(.0001,st+d);o.connect(g);g.connect(a.destination);o.start(st);o.stop(st+d+.03)}catch(e){}}
function noise(t=0,d=.2,v=.06,f=1200){const a=ac();if(!a)return;try{const n=Math.floor(a.sampleRate*d),b=a.createBuffer(1,n,a.sampleRate),c=b.getChannelData(0);for(let i=0;i<n;i++)c[i]=(Math.random()*2-1)*(1-i/n);const src=a.createBufferSource(),bp=a.createBiquadFilter(),g=a.createGain();src.buffer=b;bp.type='bandpass';bp.frequency.value=f;g.gain.value=v;src.connect(bp);bp.connect(g);g.connect(a.destination);src.start(a.currentTime+t)}catch(e){}}
const SFX={
  tap:()=>tone(520,0,.05,'triangle',.05),
  on:()=>{tone(523,0,.08,'triangle');tone(784,.07,.12,'triangle')},
  off2:()=>tone(392,0,.14,'triangle',.1,220),
  ding:()=>{tone(880,0,.25);tone(1320,.08,.3,'sine',.07)},
  pick:()=>{tone(659,0,.1,'triangle');tone(988,.09,.18,'triangle')},
  join:()=>{noise(0,.4,.04,900);tone(300,0,.4,'sine',.07,900);tone(1047,.62,.18,'triangle')},
  deal:()=>[523,587,659,784,880].forEach((f,i)=>tone(f,.15+i*.18,.14,'triangle',.08)),
  crown:()=>[523,659,784,1047].forEach((f,i)=>tone(f,i*.09,.24,'triangle')),
  fanfare:()=>[523,659,784,1047,784,1047,1319].forEach((f,i)=>tone(f,i*.11,.3,'triangle',.09)),
  tornado:()=>{noise(0,1.9,.05,700);tone(180,0,1.9,'sawtooth',.03,1400);tone(300,.2,1.7,'sine',.06,1800)},
  money:()=>{tone(1319,.25,.08,'square',.04);tone(1760,.33,.35,'square',.04)},
  email:()=>{noise(.35,.6,.05,1600);tone(500,.35,.55,'sine',.05,1500)},
  calendar:()=>{tone(130,.25,.2,'sine',.25,55);noise(.25,.08,.1,300);tone(784,.55,.22,'triangle')},
  code:()=>[660,880,660,990,1320].forEach((f,i)=>tone(f,.3+i*.07,.06,'square',.04)),
  home:()=>[1568,2093,1760,2349].forEach((f,i)=>tone(f,.25+i*.11,.28,'sine',.05)),
  writing:()=>{[0,.1,.2,.3,.4].forEach(t=>noise(.4+t,.08,.05,2600));tone(784,.95,.2,'triangle')},
  social:()=>[700,900,1100,1300].forEach((f,i)=>tone(f,.25+i*.12,.07,'sine',.1,f*1.6)),
  research:()=>{tone(400,.3,.6,'sine',.07,1600);tone(1760,.9,.25,'triangle',.07)}
};
function sfx(k){if(S.sound&&SFX[k])SFX[k]()}
function say(lines){if(!S.sound)return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(lines.join(' '));u.rate=1.05;speechSynthesis.speak(u)}catch(e){}}

document.addEventListener('click',e=>{
  const b=e.target.closest('.snd');
  if(b){S.sound=!S.sound;if(!S.sound)hush();$$('.snd').forEach(x=>x.outerHTML=sndBtn());sfx('on');return}

/* ---------- server sync ---------- */
async function api(path,body){const r=await fetch('/api/'+path,body?{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)}:{});let j={};try{j=await r.json()}catch(e){}if(!r.ok)throw Object.assign(new Error(j.error||'Something went wrong. Try again.'),{status:r.status});return j}
const OWN=['sel','skipped','benched','decided','presets','over','extra','chief','mode','focus','team','otherName','quiet','onboarded'];
const ownJSON=()=>JSON.stringify(OWN.map(k=>S[k]));
let sent='';
function hydrate(st,all){
  S.authed=true;S.name=st.name;S.email=st.email;
  if(all){for(const k of OWN)S[k]=st[k];sent=ownJSON()}
  S.keys=st.keys;S.codes=st.codes;S.joined=st.joined;S.rep=st.rep;S.seen=st.seen;S.needs=st.needs;S.blocked=st.blocked;S.tasks=st.tasks;S.skew=Date.now()-st.now;
  for(const id of ORDER){const r=st.rep[id],a=AIS[id];a.d=((r&&r.d)||[]).filter(d=>DOM[d]);a.reach=r&&r.reach&&r.reach.length?r.reach.map(esc):['Nothing yet'];a.fresh=!a.d.length;
    a.say=a.d.length?`Good at ${a.d.map(d=>DOM[d].n.toLowerCase()).join(' and ')}.${r.reach&&r.reach.length?` I can reach ${esc(r.reach.join(', ').toLowerCase())}.`:''}`:"I'm new here. No history yet!"}
  AIS.other.n=esc(S.otherName||'Other');
  const wins=st.log.slice().reverse().filter(w=>AIS[w.id]&&DOM[w.d]).map(w=>({k:w.k,d:w.d,id:w.id,text:esc(w.text)+(w.by?' ('+esc(w.by)+')':''),by:w.by?esc(w.by):'',link:w.link,min:w.min||0,at:w.at}));
  if(S._known)for(const w of wins.filter(w=>!S._known.has(w.k)).reverse())S.fresh.push(w);
  S._known=new Set(wins.map(w=>w.k)); S.wins=wins;
}
async function saveNow(){if(!S.authed)return;const j=ownJSON();if(j===sent)return;sent=j;const b={};OWN.forEach(k=>b[k]=S[k]);try{hydrate(await api('save',b),false)}catch(e){sent=''}}
setInterval(saveNow,1200);
async function pull(){if(!S.authed)return;try{hydrate(await api('state'),false)}catch(e){if(e.status===401)location.reload()}}
const now=()=>Date.now()-S.skew;
const agoTxt=ts=>{const m=Math.max(0,Math.round((now()-ts)/6e4));return m<2?'just now':m<60?`${m} min ago`:m<1440?`${Math.round(m/60)} h ago`:`${Math.round(m/1440)} d ago`};
const isQuiet=id=>!!S.joined[id]&&!S.benched[id]&&now()-(S.seen[id]||S.joined[id])>864e5;
const seenTxt=id=>S.mode==='off'?'Not following':`Last heard from ${agoTxt(S.seen[id]||S.joined[id]||now())}`;
const dayTxt=ts=>{const d=new Date(ts),t=new Date();t.setHours(0,0,0,0);return ts>=t.getTime()?'Today':ts>=t.getTime()-864e5?'Yesterday':d.toLocaleDateString(undefined,{month:'short',day:'numeric'})};
function pasteSheet(id,cb){
  const n=id?AIS[id].n:'your AI';
  const sh=openSheet(`<h1>Paste ${n}'s reply</h1><p id="pp">Paste the whole reply. Conductor finds the report line.</p><div class="cta"><textarea class="field" id="pt" aria-label="Reply text" placeholder="CONDUCTOR-CHECKIN code=…"></textarea><button class="btn">Read it</button></div>`);
  $('.btn',sh).onclick=async()=>{const b=$('.btn',sh);b.disabled=true;
    try{const r=await api('paste',{text:$('#pt').value,id});hydrate(r.state,false);const bad=r.results.find(x=>!x.ok);sh.remove();const m=(bad||r.results[0]).msg.split('. ')[0];toastMsg(esc(m.length>58?m.slice(0,56)+'…':m));if(cb)cb(r)}
    catch(e){b.disabled=false;const pp=$('#pp');pp.textContent=e.message;pp.classList.add('err')}};
  $('#pt').focus();
}
function loginSheet(){
  const sh=openSheet(`<h1>Welcome back, coach.</h1><p id="lp">Log in to your team.</p><div class="cta"><input class="field" id="le" type="email" placeholder="Email" autocomplete="email" aria-label="Email"><input class="field" id="lw" type="password" placeholder="Password" autocomplete="current-password" aria-label="Password"><button class="btn">Log in</button></div>`);
  $('.btn',sh).onclick=async()=>{try{hydrate(await api('login',{email:$('#le').value,password:$('#lw').value}),true);sh.remove();enter()}catch(e){const lp=$('#lp');lp.textContent=e.message;lp.classList.add('err')}};

  $$('.btn',sh).forEach(b=>b.onclick=()=>{sh.remove();if(b.dataset.a!=='ask')return;copy(`You reported this to Conductor on ${new Date(w.at).toLocaleString()}: "${w.text}" under ${D.n}. Show me what you did and anything I should know.`);copiedSheet(w.id,'Question copied.',`Paste it into ${a} to ask about this item.`)});
}
const winRow=(w,k)=>`<button class="row sm" data-k="${k}" style="text-align:left;width:100%">${av(w.id)}<span style="flex:1;min-width:0;display:block"><span class="who" style="display:block">${w.text}${w.n>1?`<span class="xn">&times;${w.n}</span>`:''}</span><span class="say" style="display:block">${AIS[w.id].n} · ${DOM[w.d].n} · ${w.n>1?'last ':''}${dayTxt(w.at)}</span></span><span class="ok" style="animation:none;margin-left:0">${ic('check',16)}</span></button>`;
/* One mission at a glance: who owns it, who worked on it, when, and what. */
function missionView(el,d,sheet){
  const D=DOM[d],W=S.wins.filter(w=>w.d===d),t0=now()-7*864e5,wk=W.filter(w=>w.at>=t0),o=owners(d),names=o.map(id=>AIS[id].n);
  const by={};wk.forEach(w=>{const b=by[w.id]=by[w.id]||{n:0,bots:{}};b.n++;if(w.by)b.bots[w.by]=(b.bots[w.by]||0)+1});
  const who=Object.keys(by).sort((a,b)=>by[b].n-by[a].n),top=Math.max(1,...who.map(id=>by[id].n));
  const sod=new Date(now());sod.setHours(0,0,0,0);const days=[];for(let k=6;k>=0;k--){const a=sod.getTime()-k*864e5;days.push({a,n:W.filter(w=>w.at>=a&&w.at<a+864e5).length})}
  const mx=Math.max(1,...days.map(x=>x.n)),open=(S.tasks||[]).filter(x=>x.d===d&&AIS[x.id]),min=wk.reduce((n,w)=>n+(w.min||0),0);
  const wait=open.filter(x=>x.hold).length+(S.needs||[]).filter(n=>n.u===d).length,g=groupWins(W).slice(0,40);
  const ownTxt=S.mode==='off'?'Conductor is off. No AI is following it.':S.mode==='pause'?'Paused. AIs can read, nobody acts.':!o.length?'Nobody owns this yet. Any AI can read it, none will act.':`${names.join(' and ')} ${o.length>1?'share':'owns'} it. Everyone else can only read.`;
  const act=S.mode!=='on'?`<button class="btn grn" data-a="on" style="height:50px;font-size:16px">${S.mode==='off'?'Turn it ON':'Resume'}</button>`:(o.length?`<button class="btn" data-a="brief" style="height:50px;font-size:16px">Brief ${AIS[o[0]].n}</button>`:'')+`<button class="btn ${o.length?'alt':''}" data-a="edit" style="height:50px;font-size:16px">${o.length?'Change owner':'Pick an owner'}</button>`;
  el.innerHTML=`<div class="mv"><div class="padh"><span class="mvi" style="--c:${D.c}">${ic(d,22)}</span><h1>${D.n}</h1>${sheet?'':'<button class="chip" id="mvx">Back to Done</button>'}</div>
   <div class="mvo">${o.map(id=>av(id)).join('')}<span>${ownTxt}</span></div>
   <div class="mvs"><div><b>${wk.length}</b>done this week</div><div><b>${hm(min)}</b>time back</div><div><b>${open.length}</b>open now</div></div>
   ${wait?`<div class="mvw">${wait} waiting on your decision. Check the bell on the Launch Pad.</div>`:''}
   <div class="mvh">Who · last 7 days</div>
   <div class="mvb">${who.length?who.map(id=>{const bots=Object.entries(by[id].bots).sort((a,b)=>b[1]-a[1]).map(([n,c])=>`${n} ${c}`).join(', ');return `<div class="mvr">${av(id)}<span class="nm">${AIS[id].n}${bots?`<small>${bots}</small>`:''}</span><span class="bar"><i style="width:${Math.round(by[id].n/top*100)}%;background:${D.c}"></i></span><b>${by[id].n}</b></div>`}).join(''):'<div class="mvr" style="opacity:.7">No finished work this week.</div>'}</div>
   <div class="mvh">When</div>
   <div class="mvd" role="img" aria-label="Finished items per day, last 7 days: ${days.map(x=>x.n).join(', ')}">${days.map(x=>`<span><em>${x.n||''}</em><i style="height:${x.n?Math.max(14,Math.round(x.n/mx*100)):0}%;background:${x.n?D.c:'var(--line)'}"></i><small>${new Date(x.a).toLocaleDateString(undefined,{weekday:'narrow'})}</small></span>`).join('')}</div>
   <div class="mvh">What</div>
   <div class="rows" id="mvl" style="flex:1;min-height:0">${open.map(x=>`<div class="row sm">${av(x.id)}<span style="flex:1;min-width:0;display:block"><span class="who" style="display:block">${esc(x.title)}</span><span class="say" style="display:block">${x.hold?'On hold, needs your decision':'In progress'} · ${AIS[x.id].n}${x.by?' ('+esc(x.by)+')':''} · ${agoTxt(x.at)}</span></span><button class="chip" data-clr="${x.k}" aria-label="Clear the claim ${esc(x.title)}">Clear</button></div>`).join('')}${g.map(winRow).join('')}${open.length||g.length?'':`<p style="text-align:center;margin-top:16px">Nothing here yet. Work lands when an AI reports it under ${D.n}.</p>`}</div>
   <div style="display:flex;gap:8px;flex:none">${act}</div></div>`;
  $$('#mvl button.row',el).forEach(r=>r.onclick=()=>winSheet(g[+r.dataset.k]));
  $$('[data-clr]',el).forEach(b=>b.onclick=async()=>{b.disabled=true;try{hydrate(await api('task',{k:b.dataset.clr}),false);toastMsg('Claim cleared.')}catch(e){toastMsg(e.message)}missionView(el,d,sheet)});
  const shut=()=>{if(sheet){const sh=el.closest('.sheet');if(sh)sh.remove()}};
  $$('[data-a]',el).forEach(b=>b.onclick=()=>{const a=b.dataset.a;shut();if(a==='on'){S.mode='on';saveNow();sfx('on');go(S.i)}if(a==='edit')editOwner(d);if(a==='brief')brief(o[0])});
  const x=$('#mvx',el);if(x)x.onclick=()=>{S.fd=null;histView(el);syncPick()};
  if(!sheet)syncPick();
}
function histView(el){
  if(S.fd&&el.id==='cH'&&DESK.matches&&DOM[S.fd])return missionView(el,S.fd);
  const team=sel(), max=1e9;
  const all=S.wins.map(w=>({...w,when:dayTxt(w.at)}));
  el.innerHTML=`<div class="padh"><h1>Done</h1><button class="chip" id="qz" aria-pressed="${S.quiet}">Celebrations: ${S.quiet?'Quiet':'Big'}</button>${sndBtn()}</div>
   <input class="field" id="q" type="search" placeholder="Search what got done" aria-label="Search finished items" value="${esc(S.q)}" style="height:50px;flex:none">
   <div class="filt"><div class="line">${team.map(id=>`<button data-id="${id}" class="${S.fa===id?'on':''}" aria-pressed="${S.fa===id}" aria-label="Only ${AIS[id].n}">${av(id)}</button>`).join('')}</div><span id="hc"></span></div>
   <div class="rows" id="hl" style="flex:1;min-height:0" aria-live="polite"></div>
   <div style="display:flex;gap:8px;flex:none"><button class="btn" id="pr" style="height:50px;font-size:16px">Paste a report</button><button class="btn alt" id="exp" style="height:50px;font-size:16px">Export</button></div>${navHTML()}`;
  const draw=()=>{
    const q=S.q.toLowerCase(), m=all.filter(w=>(!S.fa||w.id===S.fa)&&(!q||[w.text,AIS[w.id].n,DOM[w.d].n,w.when].join(' ').toLowerCase().includes(q)));
    $('#hc').textContent=m.length>max?`Showing ${max} of ${m.length}`:`${m.length} item${m.length===1?'':'s'}`;
    const g=groupWins(m);
    $('#hl').innerHTML=g.length?g.map(winRow).join(''):`<p style="text-align:center;margin-top:30px">${all.length?'Nothing matches.':'Nothing yet. Finished items land here when your AIs report them.'}</p>`;
    $$('#hl .row').forEach(r=>r.onclick=()=>winSheet(g[+r.dataset.k]));
  };
  draw();
  $('#pr').onclick=()=>pasteSheet(null,()=>{DESK.matches?histView(el):histView(el)});
  $('#qz').onclick=e=>{S.quiet=!S.quiet;e.currentTarget.textContent=`Celebrations: ${S.quiet?'Quiet':'Big'}`;e.currentTarget.setAttribute('aria-pressed',S.quiet)};
  $('#q').oninput=e=>{S.q=e.target.value.trim();draw()};
  $$('.filt button',el).forEach(b=>b.onclick=()=>{S.fa=S.fa===b.dataset.id?null:b.dataset.id;$$('.filt button',el).forEach(x=>{const on=S.fa===x.dataset.id;x.classList.toggle('on',on);x.setAttribute('aria-pressed',on)});draw()});
  $('#exp').onclick=()=>{
    const sh=openSheet(`<div class="big"><span class="ico" style="--c:var(--ink)">${ic('down',36)}</span></div><h1>Your data is yours.</h1><p>Team matrix and full log, in one file.</p><div class="cta"><button class="btn">Download my data</button></div>`);
    $('.btn',sh).onclick=()=>{const data=JSON.stringify({exported:new Date().toISOString(),coach:S.name,team:TN(),matrix:Object.fromEntries(DORDER.map(d=>[DOM[d].n,owners(d).map(id=>AIS[id].n)])),log:all.map(w=>({item:w.text,by:AIS[w.id].n,mission:DOM[w.d].n,when:new Date(w.at).toISOString(),link:w.link||null,minutes:w.min}))},null,1);
      try{const u=URL.createObjectURL(new Blob([data],{type:'application/json'})),a=document.createElement('a');a.href=u;a.download='conductor-export.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);toastMsg('Export downloaded.')}catch(e){copy(data);toastMsg('Export copied.')}sh.remove()};
  };
  bindNav();
}
document.addEventListener('keydown',e=>{if(e.key==='Escape')$$('.sheet').forEach(s=>s.remove())});
$('#sndTop').outerHTML=sndBtn();

/* ---------- idle character animations ---------- */
const MOVES=['look','wave','hop','squish','spin','nod','look','wave'], HI=['Hi!','Hey!','Hello!','Ready!','Yo!','Hi there!',"Let's go!"];
function act(a,m){if(!a||[...a.classList].some(c=>c.startsWith('a-')))return;m=m||MOVES[Math.floor(Math.random()*MOVES.length)];a.classList.add('a-'+m);setTimeout(()=>a.classList.remove('a-'+m),1800)}
function sayHi(o,t){if(RM||!o||$('.bub',o))return;const b=document.createElement('span');b.className='bub';b.textContent=t||HI[Math.floor(Math.random()*HI.length)];const lp=parseFloat(o.style.left);if(lp<30){b.style.setProperty('--tx','-25%');b.style.setProperty('--tl','25%')}else if(lp>70){b.style.setProperty('--tx','-75%');b.style.setProperty('--tl','75%')}o.appendChild(b);setTimeout(()=>b.remove(),1700);act($('.av',o),'wave')}
const DUET=[["I'll pay the bill!","I paid it too!"],["Email is mine!","No, mine!"],["I'll book the call!","Already booked it!"],["Writing the post…","Me too!"]];
function duet(){
  const os=$$('.orbit .o').filter(o=>{const l=parseFloat(o.style.left);return l>10&&l<90}); if(os.length<2)return;
  const a=os.splice(Math.floor(Math.random()*os.length),1)[0], b=os[Math.floor(Math.random()*os.length)], d=DUET[Math.floor(Math.random()*DUET.length)];
  sayHi(a,d[0]); setTimeout(()=>sayHi(b,d[1]),800);
  setTimeout(()=>{const L=$('.orbit .logo');if(!L||$('.bub',L))return;const x=document.createElement('span');x.className='bub fix';x.textContent='One owner each.';L.appendChild(x);setTimeout(()=>x.remove(),1700)},1900);
}
if(!RM)setInterval(()=>{
  if(document.hidden)return;
  const c=$$('.orbit .av,.tile .av,.row:not(.wait) .av,.line .av,.bplay .av,.filt .av,.newbie .av,.sheet .big .av').filter(a=>a.offsetParent&&!a.style.transform&&!a.style.animation);
  if(!c.length)return;
  const a=c[Math.floor(Math.random()*c.length)], o=a.closest('.orbit .o');
  if(o&&!$('.bub')&&Math.random()<.4)return duet();
  if(o&&Math.random()<.4)sayHi(o);else act(a);
},1300);
document.addEventListener('click',e=>{const o=e.target.closest('.orbit .o');if(o){sayHi(o);sfx('ding')}});
DESK.addEventListener('change',()=>go(S.i));
(async()=>{try{hydrate(await api('state'),true);S.sel.forEach(id=>{if(S.onboarded&&!S.joined[id])S.skipped[id]=true});build();S.i=S.onboarded?S.steps.length-1:2}catch(e){build()}render()})();
</script>
